<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>彩绘玻璃拼片台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>🪟 彩绘玻璃拼片台</h1>
    <nav class="tabs">
      <button id="tabDraft" class="tab active">草稿编辑</button>
      <button id="tabPublished" class="tab">已发布图纸</button>
    </nav>
  </header>

  <!-- ============ 草稿视图 ============ -->
  <main id="viewDraft" class="view">
    <aside class="panel">
      <section>
        <h2>图纸</h2>
        <label>选择图纸
          <select id="designSelect"></select>
        </label>
        <details>
          <summary>新建图纸</summary>
          <div class="form-row">
            <label>名称<input id="newName" type="text" placeholder="未命名图纸" maxlength="80"></label>
          </div>
          <div class="form-row two">
            <label>窗框宽 (mm)<input id="newWidth" type="number" min="1" step="1" value="300"></label>
            <label>窗框高 (mm)<input id="newHeight" type="number" min="1" step="1" value="200"></label>
          </div>
          <button id="btnCreate" class="primary">新建</button>
        </details>
        <div id="designMeta" class="muted"></div>
      </section>

      <section id="editSection" hidden>
        <h2>拼片编辑</h2>
        <div class="hint">在画布上点击添加整数毫米顶点，双击或点击“闭合多边形”完成；也可直接输入坐标。</div>
        <div class="form-row">
          <label>颜色<input id="pieceColor" type="color" value="#4c9aff"></label>
        </div>
        <label>手工输入顶点（每行 <code>x,y</code>，整数毫米）
          <textarea id="coordsInput" rows="4" placeholder="0,0&#10;120,0&#10;120,80"></textarea>
        </label>
        <div class="btn-row">
          <button id="btnStart" class="primary">开始绘制新片</button>
          <button id="btnFinish">闭合多边形</button>
          <button id="btnUndo">撤销点</button>
          <button id="btnCancel">取消</button>
        </div>
        <div id="editHint" class="hint"></div>
      </section>

      <section id="pieceListSection" hidden>
        <h2>拼片列表 (<span id="pieceCount">0</span>)</h2>
        <ul id="pieceList"></ul>
      </section>

      <section id="statusSection" hidden>
        <h2>覆盖状态</h2>
        <div id="coverageStatus"></div>
        <div class="btn-row">
          <button id="btnPublish" class="primary big">发布图纸</button>
        </div>
        <div id="publishResult"></div>
      </section>
    </aside>

    <section class="canvas-wrap">
      <div id="errorBanner" class="banner" hidden></div>
      <canvas id="canvas" width="900" height="640"></canvas>
      <div id="cursorPos" class="muted small"></div>

      <div class="lead-panel">
        <h2>铅条下料清单（草稿实时）</h2>
        <div id="leadList"></div>
      </div>
    </section>
  </main>

  <!-- ============ 发布视图 ============ -->
  <main id="viewPublished" class="view" hidden>
    <aside class="panel">
      <section>
        <h2>历史发布版</h2>
        <label>图纸
          <select id="pubDesignSelect"></select>
        </label>
        <label>版本
          <select id="pubVersionSelect"></select>
        </label>
        <div id="pubMeta" class="muted"></div>
        <div class="hint">发布版为不可变快照，仅供查阅。</div>
      </section>
      <section>
        <h2>玻璃片明细</h2>
        <ul id="pubPieceList"></ul>
      </section>
      <section>
        <h2>铅条下料清单</h2>
        <div id="pubLeadList"></div>
      </section>
    </aside>
    <section class="canvas-wrap">
      <canvas id="pubCanvas" width="900" height="640"></canvas>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
